<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Contact Us - Five-Page Web Project</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
 <nav class="navbar">
 <a href="index.html" class="brand-logo">DevTeam Platform</a>
 <ul class="nav-links">
 <li><a href="index.html">Home</a></li>
 <li><a href="about.html">About</a></li>
 <li><a href="products.html">Products</a></li>
 <li><a href="projects.html">Projects</a></li>
 <li><a href="contact.html" class="active">Contact</a></li>
 </ul>
 </nav>
 </header>
 <main>
 <div class="form-container">
 <h2>Send Us a Message</h2>
 <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Have questions?
Fill out the form below to reach out to our team.</p>
 <form action="#" method="post">
 <div class="form-group">
 <label for="name">Full Name</label>
 <input type="text" id="name" name="name" placeholder="Enter your full
name" required>
 </div>
 <div class="form-group">
 <label for="email">Email Address</label>
 <input type="email" id="email" name="email"
placeholder="name@example.com" required>
 </div>
 <div class="form-group">
 <label for="message">Message</label>
 <textarea id="message" name="message" rows="5" placeholder="Write your
message here..." required></textarea>
 </div>
 <button type="submit" class="btn">Send Message</button>
 </form>
 </div>
 </main>
 <footer>
 <p>&copy; 2025 DevTeam Platform. All rights reserved.</p>
 </footer>
</body>
</html>
